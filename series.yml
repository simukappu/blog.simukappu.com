# Series mapping for Build at Scale blog archive.
#
# The `posts:` block below is GENERATED by tools/update-series.py, which reads each post's cuid, slug, and series membership from the Hashnode GraphQL API (gql-beta.hashnode.com, paid-plan PAT required). Do not edit `posts:` by hand; it is overwritten on each run.
#
# Only the `series:` metadata block (names and URLs) is maintained by hand.
#
# WHEN YOU PUBLISH A NEW POST (or change a post's series):
#   Normally nothing: Hashnode's backup integration pushes the new <cuid>.md,
#   and CI (.github/workflows/build-index.yml) refreshes this file from the API
#   and regenerates README.md. Requires the HASHNODE_PAT repository secret.
#
#   The manual path, for when the secret is unavailable, or when you changed the
#   series of an ALREADY PUBLISHED post (that only modifies a backup file, so CI
#   takes the README-only path and will not pick up the new series):
#     1. Run:  python tools/update-series.py
#        (full sync from the API; needs HASHNODE_PAT env var or
#        ~/.config/career-box-metrics/hashnode-pat locally)
#     2. Commit the updated series.yml.  README.md is regenerated by CI
#        (or run `python tools/build-index.py` locally).
#   A manual workflow_dispatch does the same, with refresh_series on by default.
#
# Posts not in any series are recorded as `<cuid>: null`.


# Series mapping for Build at Scale blog archive.
#
# The `posts:` block below is GENERATED by tools/update-series.py, which reads each post's series membership from the live blog (headless browser, since Hashnode does not sync series into frontmatter and its GraphQL API is now paid). Do not edit `posts:` by hand; it is overwritten on each run.
#
# Only the `series:` metadata block (names and URLs) is maintained by hand.
#
# WHEN YOU PUBLISH A NEW POST (run locally, not in CI):
#   The Vercel security checkpoint blocks datacenter IPs, so CI cannot resolve series. After publishing on Hashnode and assigning the series:
#     1. Pull the latest mirror (Hashnode sync adds the new <cuid>.md).
#     2. Run:  python tools/update-series.py
#        (resolves only the new post via a local headless browser)
#     3. Commit the updated series.yml.  README.md is regenerated by CI
#        (or run `python tools/build-index.py` locally).
#   Use `--full` to re-resolve every post (e.g. after changing a post's series on an already-published article).
#
# Posts not in any series are recorded as `<cuid>: null`.

series:

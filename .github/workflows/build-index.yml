name: Build README index

on:
  push:
    branches: [main]
    paths:
      - "*.md"
      # series.yml is a push trigger so a manual series.yml update (applied
      # by hand on the mirror) regenerates README.md via CI. The bot's own
      # README commit is pushed with the default GITHUB_TOKEN, which does not
      # trigger another workflow run, so this cannot recurse.
      - "series.yml"
      - "tools/build-index.py"
      - "tools/update-series.py"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:
    inputs:
      refresh_series:
        description: >-
          Refresh series.yml from the Hashnode GraphQL API (requires the
          HASHNODE_PAT repository secret; see series.yml header).
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      # Hashnode's backup integration pushes one <cuid>.md per post into the
      # repository root. A file that is newly *added* is a newly published post
      # whose series membership cannot be in the committed series.yml yet, so
      # that is the one push that has to hit the API. Pushes that only modify an
      # existing post, series.yml, or the tools need README regeneration alone.
      #
      # The added-file list comes from the push event payload rather than git
      # history, so the shallow default checkout is enough. The payload caps
      # commits at 20; Hashnode backup pushes are one commit per post, so that
      # ceiling is not reachable on the automated path. The root-level, non-README
      # filter mirrors what build-index.py itself treats as a post.
      - name: Check whether the push added a new post file
        id: detect
        if: github.event_name == 'push'
        run: |
          added=$(jq -r '[.commits[]?.added[]?] | .[]?' "$GITHUB_EVENT_PATH" \
            | grep -E '^[^/]+\.md$' | grep -vx 'README.md' || true)
          if [[ -n "$added" ]]; then
            echo "New post file(s) in this push:"
            echo "$added"
            echo "new_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new post file in this push; README regeneration only."
            echo "new_post=false" >> "$GITHUB_OUTPUT"
          fi

      # Reads the Hashnode GraphQL API and needs the HASHNODE_PAT repository
      # secret (paid-plan token). Runs automatically when a new post lands, and
      # on manual dispatch unless refresh_series is unchecked. Failure is
      # tolerated so README is still rebuilt from the committed series.yml, and
      # the next step turns that into a visible warning.
      - name: Refresh series mapping from the Hashnode API
        id: refresh
        if: >-
          steps.detect.outputs.new_post == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.refresh_series)
        continue-on-error: true
        env:
          HASHNODE_PAT: ${{ secrets.HASHNODE_PAT }}
        run: python tools/update-series.py

      - name: Warn if the series refresh did not succeed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::warning title=Series refresh failed::README was built from the committed series.yml, so a new post may be missing its series. Check the HASHNODE_PAT repository secret, then re-run this workflow manually."

      - name: Build README
        if: always()
        run: python tools/build-index.py

      - name: Commit if changed
        if: always()
        run: |
          if [[ -n "$(git status --porcelain series.yml README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add series.yml README.md
            git commit -m "chore: refresh series mapping and README index"
            git push
          else
            echo "series.yml and README are up to date."
          fi

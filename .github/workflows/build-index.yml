name: Build README index

on:
  push:
    branches: [main]
    paths:
      - "*.md"
      # series.yml is a push trigger so a manual series.yml update (applied
      # by hand on the mirror) regenerates README.md via CI. The bot's own
      # README commit is pushed with the default GITHUB_TOKEN, which does not
      # trigger another workflow run, so this cannot recurse.
      - "series.yml"
      - "tools/build-index.py"
      - "tools/update-series.py"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:
    inputs:
      refresh_series:
        description: >-
          Refresh series.yml from the Hashnode GraphQL API (requires the
          HASHNODE_PAT repository secret; see series.yml header).
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      # Decide whether this run has to call the Hashnode API, by comparing the
      # checked-out state rather than by inspecting the push event.
      #
      # A post that exists as a <cuid>.md backup but is absent from the `posts:`
      # map in series.yml has not been resolved yet, which is exactly the state a
      # newly published post leaves behind. Asking that question needs no event
      # payload, so it holds whether Hashnode's backup integration presents the
      # post as an added file or as a modification of one it had already synced.
      #
      # This replaced an added-file check over the push payload
      # (`.commits[].added[]`, filtered to root-level *.md). That check missed
      # article 008 on 2026/08/07: the README picked the post up, because
      # build-index.py reads the filesystem, but the Series column stayed empty
      # because series.yml was never refreshed. The state comparison also
      # self-heals, where the event check did not: if a refresh fails, the next
      # push retries instead of needing a manual re-run forever.
      #
      # Not covered, by design: changing the series of an ALREADY published post.
      # Its cuid is already in the map, so only the value moves, and detecting
      # that would mean calling the API on every push. Use workflow_dispatch or
      # run update-series.py locally (tools/MAINTAINING.md).
      - name: Check whether any post is missing from series.yml
        id: detect
        if: github.event_name == 'push'
        run: |
          unmapped=$(python tools/build-index.py --list-unmapped)
          if [[ -n "$unmapped" ]]; then
            echo "Post cuid(s) not yet mapped in series.yml:"
            echo "$unmapped"
            echo "needs_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "Every post is already mapped in series.yml; README regeneration only."
            echo "needs_refresh=false" >> "$GITHUB_OUTPUT"
          fi

      # Reads the Hashnode GraphQL API and needs the HASHNODE_PAT repository
      # secret (paid-plan token). Runs automatically when a post is unmapped, and
      # on manual dispatch unless refresh_series is unchecked. Failure is
      # tolerated so README is still rebuilt from the committed series.yml, and
      # the next step turns that into a visible warning.
      - name: Refresh series mapping from the Hashnode API
        id: refresh
        if: >-
          steps.detect.outputs.needs_refresh == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.refresh_series)
        continue-on-error: true
        env:
          HASHNODE_PAT: ${{ secrets.HASHNODE_PAT }}
        run: python tools/update-series.py

      - name: Warn if the series refresh did not succeed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::warning title=Series refresh failed::README was built from the committed series.yml, so a new post may be missing its series. Check the HASHNODE_PAT repository secret, then re-run this workflow manually."

      - name: Build README
        if: always()
        run: python tools/build-index.py

      - name: Commit if changed
        if: always()
        run: |
          if [[ -n "$(git status --porcelain series.yml README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add series.yml README.md
            git commit -m "chore: refresh series mapping and README index"
            git push
          else
            echo "series.yml and README are up to date."
          fi
